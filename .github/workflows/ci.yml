name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentx
          POSTGRES_PASSWORD: agentx
          POSTGRES_DB: agentx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentx" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Sources are pure ASCII (no hidden Unicode / Trojan Source)
        run: |
          if LC_ALL=C grep -rnP '[^\x00-\x7F]' src migrations; then
            echo "Non-ASCII characters found; use escape sequences instead." && exit 1
          fi
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://agentx:agentx@127.0.0.1:5432/agentx_test
      - run: npm audit --audit-level=high --omit=dev

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev

  docker:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agentx:ci .
